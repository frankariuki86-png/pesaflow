services:
  - type: web
    name: pesaflow-web
    runtime: node
    buildCommand: npm install && npm --prefix packages/web run build
    startCommand: npm --prefix packages/web run preview -- --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
